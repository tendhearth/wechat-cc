# T5: 原有功能验收移到唯一对话、搜索引用与原详情。
appId: com.tendhearth.app
---
- runFlow: subflows/_start.yaml
- tapOn:
    id: welcome-look-first
- extendedWaitUntil:
    visible:
      id: conversation-waiting
    timeout: 10000
- openLink: tendhearth://push-open?kind=permission&taskId=a1b2c3d4&requestId=perm-demo-1
- runFlow: subflows/_open-link-guard.yaml
- extendedWaitUntil:
    visible:
      id: approval-title
    timeout: 10000
- assertVisible:
    id: approval-raw-inline
- tapOn:
    id: topbar-back
- extendedWaitUntil:
    visible:
      id: conversation-waiting
    timeout: 10000
- openLink: tendhearth://push-open?kind=task_done&taskId=e5f6a7b8
- runFlow: subflows/_open-link-guard.yaml
- extendedWaitUntil:
    visible:
      id: progress-status
    timeout: 10000
- assertVisible: 这一轮做完了|Done for this round
- assertNotVisible:
    id: push-gone
- tapOn:
    id: topbar-back
- extendedWaitUntil:
    visible:
      id: conversation-waiting
    timeout: 10000
- openLink: tendhearth://push-open?kind=permission&taskId=cli%3Ademo-cli-blog
- runFlow: subflows/_open-link-guard.yaml
- extendedWaitUntil:
    visible:
      id: terminal-detail-allow
    timeout: 10000
- assertVisible:
    id: terminal-detail-pending
- assertNotVisible:
    id: approval-allow
- tapOn:
    id: topbar-back
- extendedWaitUntil:
    visible:
      id: conversation-waiting
    timeout: 10000
- openLink: tendhearth://push-open?kind=task_done&taskId=ffffffff
- runFlow: subflows/_open-link-guard.yaml
- extendedWaitUntil:
    visible:
      id: push-gone
    timeout: 10000
- assertVisible:
    text: 这件事在电脑上已经不在了。|That item is no longer on your computer\.
- tapOn:
    id: push-go-now
- extendedWaitUntil:
    visible:
      id: conversation-waiting
    timeout: 10000
- openLink: tendhearth://push-open?kind=permission&taskId=..%2F..%2Fx
- runFlow: subflows/_open-link-guard.yaml
- extendedWaitUntil:
    visible:
      id: conversation-waiting
    timeout: 10000
- assertNotVisible:
    id: push-opening
- runFlow: subflows/_work.yaml
- extendedWaitUntil:
    visible:
      id: search-work
    timeout: 5000
- openLink: tendhearth://push-open?kind=permission&taskId=a1b2c3d4&requestId=perm-demo-1
- runFlow: subflows/_open-link-guard.yaml
- extendedWaitUntil:
    visible:
      id: approval-title
    timeout: 10000
- tapOn:
    id: topbar-back
- extendedWaitUntil:
    visible:
      id: conversation-waiting
    timeout: 10000
- openLink: tendhearth://push-open?kind=permission&taskId=a1b2c3d4&requestId=perm-demo-1
- runFlow: subflows/_open-link-guard.yaml
- extendedWaitUntil:
    visible:
      id: approval-title
    timeout: 10000
- tapOn:
    id: topbar-back
- extendedWaitUntil:
    visible:
      id: conversation-waiting
    timeout: 10000
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 1%, 50%
          end: 85%, 50%
          duration: 400
      - swipe:
          start: 1%, 50%
          end: 85%, 50%
          duration: 400
- assertVisible:
    id: conversation-waiting
- assertNotVisible:
    id: search-work
- openLink: tendhearth://push-open?kind=permission&taskId=a1b2c3d4&requestId=perm-demo-1
- runFlow: subflows/_open-link-guard.yaml
- extendedWaitUntil:
    visible:
      id: approval-allow
      enabled: true
    timeout: 10000
- tapOn:
    id: approval-allow
- extendedWaitUntil:
    visible:
      id: progress-status
    timeout: 10000
- openLink: tendhearth://push-open?kind=permission&taskId=a1b2c3d4&requestId=perm-demo-1
- runFlow: subflows/_open-link-guard.yaml
- extendedWaitUntil:
    visible:
      id: approval-handled
    timeout: 10000
- assertNotVisible:
    id: approval-allow
