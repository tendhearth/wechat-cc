# ＋交办后回到对应 CC 引用；打开过程检查结果，再在搜索找到同一事项。
appId: com.tendhearth.app
---
- runFlow: subflows/_start.yaml
- tapOn:
    id: welcome-look-first
- extendedWaitUntil:
    visible:
      id: chat-input
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: chat-plus
    timeout: 10000
- tapOn:
    id: chat-plus
- tapOn:
    id: chat-handoff
- tapOn:
    id: compose-input
- inputText: Maestro demo task
- extendedWaitUntil:
    visible:
      id: compose-adjust
      enabled: true
    timeout: 5000
- tapOn:
    id: compose-adjust
- extendedWaitUntil:
    visible:
      id: compose-adjust-sheet
    timeout: 5000
- scrollUntilVisible:
    element:
      text: 完成|Done
    direction: DOWN
- tapOn:
    text: 完成|Done
- extendedWaitUntil:
    notVisible:
      id: compose-adjust-sheet
    timeout: 5000
- waitForAnimationToEnd
- tapOn:
    id: compose-send
- extendedWaitUntil:
    visible:
      id: delegation-matter-demo0001
    timeout: 10000
- tapOn:
    id: row-matter-demo0001
- extendedWaitUntil:
    visible:
      id: progress-status
    timeout: 10000
- assertVisible: Maestro demo task
- extendedWaitUntil:
    visible: 这一轮做完了|Done for this round
    timeout: 8000
- tapOn:
    id: topbar-back
- extendedWaitUntil:
    visible:
      id: chat-input
    timeout: 5000
- runFlow: subflows/_work.yaml
- scrollUntilVisible:
    element:
      id: row-matter-demo0001
    direction: DOWN
    centerElement: true
- extendedWaitUntil:
    visible:
      id: row-matter-demo0001
    timeout: 5000
- assertVisible: Maestro demo task, (这一轮做完了|Done for this round)
