# 交办:此刻 → 跟 CC 说 → 交给 CC 去做一件事 → 输入 → 交给 CC → 进展页 2 秒后「这一轮做完了」→ 一起做里出现这件新事。
appId: com.tendhearth.app
---
- runFlow: subflows/_start.yaml
- tapOn:
    id: welcome-look-first
- extendedWaitUntil:
    visible:
      id: now-say
    timeout: 10000
- tapOn:
    id: now-say
- extendedWaitUntil:
    visible:
      id: chat-handoff
    timeout: 5000
- tapOn:
    id: chat-handoff
- tapOn:
    id: compose-input
- inputText: "Maestro demo task"
# 项目与执行方式不改默认值;关掉面板后发送,不依赖已删掉的说明文字收键盘。
- extendedWaitUntil:
    visible:
      id: compose-adjust
      enabled: true
    timeout: 5000
- tapOn:
    id: compose-adjust
- extendedWaitUntil:
    visible:
      id: compose-adjust-sheet
    timeout: 5000
- scrollUntilVisible:
    element:
      text: "完成|Done"
    direction: DOWN
- tapOn:
    text: "完成|Done"
- extendedWaitUntil:
    notVisible:
      id: compose-adjust-sheet
    timeout: 5000
- waitForAnimationToEnd
- tapOn:
    id: compose-send
# 新事项建好后直接进它的进展页。
- extendedWaitUntil:
    visible:
      id: progress-status
    timeout: 10000
- assertVisible: "Maestro demo task"
- extendedWaitUntil:
    visible: "这一轮做完了|Done for this round"
    timeout: 8000
- tapOn:
    id: topbar-back
# 交办是从对话页点进来的:返回先回到对话页,再返回此刻。
- extendedWaitUntil:
    visible:
      id: chat-input
    timeout: 5000
- tapOn:
    id: topbar-back
# 行的无障碍标签 = 「标题, 状态词」。点标签同 demo-walkthrough:没切过去就再点一次。
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: tab-together
      - extendedWaitUntil:
          visible:
            id: together-item-demo0001
          timeout: 3000
- assertVisible: "Maestro demo task, (这一轮做完了|Done for this round)"
