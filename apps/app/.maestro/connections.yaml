# 此刻 → 连接(红 / 琥珀都有文字)→ 返回 → 一起做的菜单 → 电脑会话 → 读一条 → 设置里的连接
appId: com.tendhearth.app
---
- runFlow: subflows/_start.yaml
- tapOn:
    id: welcome-look-first
- extendedWaitUntil:
    visible:
      id: now-connections
    timeout: 10000
- scrollUntilVisible:
    element:
      id: now-connections
    centerElement: true
- tapOn:
    id: now-connections
- extendedWaitUntil:
    visible:
      id: connections-source-wechat_history
    timeout: 5000
- assertVisible: ".*(没加载|Not loaded).*"
# 演示:顶上一行在;电脑写成「演示电脑 · 示例」,不冒充在线(终审 I1 / M8)
- assertVisible:
    id: connections-headline
- assertVisible: ".*(演示电脑|Demo computer).*"
- assertVisible:
    id: connections-computer-home
- tapOn:
    id: topbar-back
- tapOn:
    id: tab-together
- tapOn:
    id: together-more
- tapOn:
    id: together-sessions
- extendedWaitUntil:
    visible:
      id: sessions-row-demo-claude-1
    timeout: 5000
- tapOn:
    id: sessions-row-demo-claude-1
- extendedWaitUntil:
    visible:
      id: session-message-0
    timeout: 5000
# 设置里也能直接进连接(会话读页 → 列表 → 一起做 → 此刻 → 设置)
- tapOn:
    id: topbar-back
- tapOn:
    id: topbar-back
- tapOn:
    id: tab-now
- tapOn:
    id: topbar-settings
- scrollUntilVisible:
    element:
      id: settings-connections
- tapOn:
    id: settings-connections
- extendedWaitUntil:
    visible:
      id: connections-computer-home
    timeout: 5000
