# 独立工作区(2026-10-08):一起做 → 整理笔记那件(独立分支)→ 提交到分支 → 合回项目(点两下)→ 任务页说「已合回」
# → 删除工作区(点两下)→ 出现「重新打开工作区」→ 重开 → 「交给另一位另做一份」进交办页:要求、来源项目、独立副本和另一位执行者已选好。旧工作区演示，不证明 UUID 分支起点或真实 Git。
appId: com.tendhearth.app
---
- runFlow: subflows/_start.yaml
- tapOn:
    id: welcome-look-first
- extendedWaitUntil:
    visible:
      id: now-connections
    timeout: 10000
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: tab-together
      - extendedWaitUntil:
          visible:
            id: together-item-a1b2c3d4
          timeout: 3000
- scrollUntilVisible:
    element:
      id: together-item-e5f6a7b8
- tapOn:
    id: together-item-e5f6a7b8
- scrollUntilVisible:
    element:
      id: progress-worktree
- assertVisible: ".*cc/notes001.*"
- tapOn:
    id: progress-wt-commit
- extendedWaitUntil:
    visible:
      id: progress-wt-note
    timeout: 5000
# 合回要点两下:第一下只换成确认字样
- tapOn:
    id: progress-wt-merge
- assertVisible: ".*(再点一次：快进合并到项目|Tap again to fast-forward the project).*"
- tapOn:
    id: progress-wt-merge
- extendedWaitUntil:
    visible: ".*(已合回项目|merged into the project).*"
    timeout: 5000
- tapOn:
    id: progress-wt-remove
- tapOn:
    id: progress-wt-remove
- extendedWaitUntil:
    visible:
      id: progress-wt-reopen
    timeout: 5000
- tapOn:
    id: progress-wt-reopen
- extendedWaitUntil:
    visible:
      id: progress-wt-fork
    timeout: 5000
- takeScreenshot: worktree-matter
- tapOn:
    id: progress-wt-fork
- extendedWaitUntil:
    visible:
      id: compose-adjust-sheet
    timeout: 10000
# fork 自动打开设置；直接核对预选状态，不靠点击制造结果。
- assertVisible:
    text: "作品集|Portfolio"
    checked: true
- assertVisible:
    text: "独立副本（Git 项目默认）|Separate copy \\(default for Git projects\\)"
    checked: true
- assertVisible:
    text: "Codex"
    checked: true
- assertVisible:
    text: "Claude"
    checked: false
- assertNotVisible:
    id: compose-base
- tapOn: "完成|Done"
- extendedWaitUntil:
    visible:
      id: compose-input
    timeout: 5000
- assertVisible:
    id: compose-input
    text: ".*(把零散想法收一收|A home for loose ideas).*"
- takeScreenshot: worktree-fork-compose
