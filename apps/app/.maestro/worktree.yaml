# T5: 原有功能验收移到唯一对话、搜索引用与原详情。
appId: com.tendhearth.app
---
- runFlow: subflows/_start.yaml
- tapOn:
    id: welcome-look-first
- extendedWaitUntil:
    visible:
      id: now-connections
    timeout: 10000
- runFlow: subflows/_work.yaml
- extendedWaitUntil:
    visible:
      id: row-matter-a1b2c3d4
    timeout: 5000
- scrollUntilVisible:
    element:
      id: row-matter-e5f6a7b8
- tapOn:
    id: row-matter-e5f6a7b8
- scrollUntilVisible:
    element:
      id: progress-process
    direction: DOWN
- tapOn:
    id: progress-process
- scrollUntilVisible:
    element:
      id: progress-worktree
- assertVisible: .*cc/notes001.*
- tapOn:
    id: progress-wt-commit
- extendedWaitUntil:
    visible:
      id: progress-wt-note
    timeout: 5000
- tapOn:
    id: progress-wt-merge
- assertVisible: .*(再点一次：快进合并到项目|Tap again to fast-forward the project).*
- tapOn:
    id: progress-wt-merge
- extendedWaitUntil:
    visible: .*(已合回项目|merged into the project).*
    timeout: 5000
- tapOn:
    id: progress-wt-remove
- tapOn:
    id: progress-wt-remove
- extendedWaitUntil:
    visible:
      id: progress-wt-reopen
    timeout: 5000
- tapOn:
    id: progress-wt-reopen
- extendedWaitUntil:
    visible:
      id: progress-wt-fork
    timeout: 5000
- takeScreenshot: worktree-matter
- tapOn:
    id: progress-wt-fork
- extendedWaitUntil:
    visible:
      id: compose-adjust-sheet
    timeout: 10000
- scrollUntilVisible:
    element:
      text: 完成|Done
    direction: DOWN
- tapOn: 完成|Done
- extendedWaitUntil:
    visible:
      id: compose-adjust
      enabled: true
    timeout: 10000
- tapOn:
    id: compose-adjust
- extendedWaitUntil:
    visible:
      id: compose-adjust-sheet
    timeout: 5000
- scrollUntilVisible:
    element:
      id: compose-isolation
    direction: DOWN
- assertVisible:
    id: compose-base
- takeScreenshot: worktree-fork-compose
