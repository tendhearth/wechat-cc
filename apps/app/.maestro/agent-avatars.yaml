# 执行者归属验收出图:一起做与终端列表突出事情,执行者名称留在读屏标签与详情;事项里的执行者收在展开的过程与执行信息里。演示模式,不进 CI。
appId: com.tendhearth.app
---
- runFlow: subflows/_start.yaml
- tapOn:
    id: welcome-look-first
- extendedWaitUntil:
    visible:
      id: now-cc
    timeout: 10000
- tapOn:
    id: tab-together
- extendedWaitUntil:
    visible:
      id: together-item-a1b2c3d4
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: a01-together
- scrollUntilVisible:
    element:
      id: together-terminal
    direction: DOWN
- takeScreenshot: a02-terminal
- scrollUntilVisible:
    element:
      id: together-item-a1b2c3d4
    direction: UP
- tapOn:
    id: together-item-a1b2c3d4
- extendedWaitUntil:
    visible:
      id: approval-allow
      enabled: true
    timeout: 5000
- tapOn:
    id: approval-allow
- extendedWaitUntil:
    visible:
      id: progress-status
    timeout: 5000
- scrollUntilVisible:
    element:
      id: progress-process
    direction: DOWN
- tapOn:
    id: progress-process
- scrollUntilVisible:
    element:
      id: progress-agents
    direction: DOWN
- takeScreenshot: a03-detail
