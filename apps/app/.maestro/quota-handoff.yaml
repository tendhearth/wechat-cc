# T5: 原有功能验收移到唯一对话、搜索引用与原详情。
appId: com.tendhearth.app
---
- runFlow: subflows/_start.yaml
- tapOn:
    id: welcome-look-first
- extendedWaitUntil:
    visible:
      id: now-connections
    timeout: 10000
- runFlow: subflows/_work.yaml
- extendedWaitUntil:
    visible:
      id: row-matter-a1b2c3d4
    timeout: 5000
- scrollUntilVisible:
    element:
      id: row-matter-f3a4b5c6
    centerElement: true
- tapOn:
    id: row-matter-f3a4b5c6
- extendedWaitUntil:
    visible:
      id: progress-handoff-note
    timeout: 10000
- assertVisible: .*(Claude 的额度已用完|Claude is out of quota).*
- tapOn:
    id: progress-handoff-action
- extendedWaitUntil:
    visible:
      id: handoff-sheet
    timeout: 5000
- assertVisible: .*(同一个文件夹|same folder).*
- assertVisible: .*(看不到 Claude 之前的对话|can.t see Claude.s earlier conversation).*
- assertVisible:
    id: handoff-confirm
    text: 交给 Codex 继续|Hand to Codex
- tapOn:
    id: handoff-confirm
- extendedWaitUntil:
    visible:
      id: progress-status
    timeout: 10000
- scrollUntilVisible:
    element:
      id: progress-process
    direction: DOWN
- tapOn:
    id: progress-process
- extendedWaitUntil:
    visible:
      id: progress-conversation
    timeout: 5000
- assertVisible: .*(接替 Claude|Taking over from Claude).*
- assertNotVisible:
    id: progress-handoff
- tapOn:
    id: topbar-back
- extendedWaitUntil:
    visible:
      id: progress-handoff-open
    timeout: 10000
- assertVisible: .*(已经交给 Codex 继续|Handed to Codex).*
