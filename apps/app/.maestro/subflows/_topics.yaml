# T4 / 管家的屋子:话题从 ⋯ → 记忆 → 话题 进(输入框上方话题行已撤);sheet、来源与事项、历史话题、返回保留主人草稿。
appId: com.tendhearth.app
---
- tapOn:
    id: chat-model-open
- tapOn:
    id: topbar-back
- tapOn:
    id: chat-input
- inputText: "topic draft stays"
- tapOn:
    id: home-more
- tapOn:
    id: conversation-memory
- tapOn:
    id: memory-topics
- extendedWaitUntil:
    visible:
      id: topics-search
    timeout: 10000
- tapOn:
    id: topic-demo-backup
- extendedWaitUntil:
    visible:
      id: topic-sheet
    timeout: 10000
- assertVisible:
    id: topic-matter-a1b2c3d4
- assertVisible: "这个项目的会话|Sessions in this project"
- assertVisible: ".*Claude.*(等你批准 · Bash|Approval needed · Bash).*"
- assertVisible:
    id: topic-session-a1b2c3d4
- assertVisible: ".*(等你批准 · Bash|Approval needed · Bash).*"
- takeScreenshot: topics-projects-sessions
- scrollUntilVisible:
    element:
      id: topic-session-respond-a1b2c3d4
    direction: DOWN
    timeout: 10000
- tapOn:
    id: topic-session-respond-a1b2c3d4
- extendedWaitUntil:
    visible:
      id: approval-title
    timeout: 10000
- takeScreenshot: topics-projects-existing-response
- tapOn:
    id: topbar-back
- assertVisible:
    id: topic-sheet
- takeScreenshot: t5-topic-sheet
# 长内容可从底部 sheet 展开为全屏，再读记忆与来源。
- swipe:
    start: 50%, 47%
    end: 50%, 12%
    duration: 600
- waitForAnimationToEnd
- takeScreenshot: t5-topic-expanded
- scrollUntilVisible:
    element:
      text: "家里的服务与备份"
    direction: DOWN
- assertVisible: "家里的服务与备份"
- assertVisible: "上次：备份留在本地"
- scrollUntilVisible:
    element:
      id: topic-session-b0b0cafe
    direction: DOWN
- assertVisible: ".*Codex.*(答完了|Replied).*"
- assertNotVisible:
    id: topic-session-respond-b0b0cafe
- takeScreenshot: topics-waiting-terminal-replied
- scrollUntilVisible:
    element:
      id: topic-entry-demo-entry
    centerElement: true
    direction: DOWN
- tapOn:
    id: topic-entry-demo-entry
- assertVisible: "每周核验一次备份。"
- takeScreenshot: t5-topic-memory-source
- tapOn:
    id: topbar-back
- tapOn:
    id: topbar-back
- tapOn:
    id: topbar-back
- assertVisible:
    id: chat-input
    text: "topic draft stays"
- tapOn:
    id: home-more
- tapOn:
    id: conversation-memory
- tapOn:
    id: memory-topics
- extendedWaitUntil:
    visible:
      id: topics-search
    timeout: 10000
- tapOn:
    id: topic-demo-trip
- extendedWaitUntil:
    visible:
      id: topic-sheet
    timeout: 5000
- tapOn:
    id: topbar-back
- tapOn:
    id: topbar-back
- tapOn:
    id: topbar-back
- assertVisible:
    id: chat-input
    text: "topic draft stays"
- takeScreenshot: t5-conversation-draft-retained
