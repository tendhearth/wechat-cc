# 打开直接说话；小 CC 聚焦输入；发送与回复、离开工具后返回同一对话。
appId: com.tendhearth.app
---
- runFlow: subflows/_start.yaml
- tapOn:
    id: welcome-look-first
- extendedWaitUntil:
    visible:
      id: chat-input
    timeout: 10000
- tapOn:
    id: now-cc
- takeScreenshot: cc-alive-app-demo-idle
- extendedWaitUntil:
    visible:
      id: chat-input
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: chat-input
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: chat-input
    timeout: 5000
- waitForAnimationToEnd
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: chat-input
      - inputText: Maestro hello
      - assertVisible:
          id: chat-send
          enabled: true
# iOS 的 multiline 输入没有通用 hideKeyboard 动作；打开只读模型层再返回收起键盘。
- tapOn:
    id: chat-model-open
- tapOn:
    id: topbar-back
- extendedWaitUntil:
    visible:
      id: chat-input
    timeout: 5000
- tapOn:
    id: chat-send
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: chat-thinking
    timeout: 3000
- extendedWaitUntil:
    visible: .*收到。这是演示模式.*|.*Got it. This is the demo.*
    timeout: 8000
- assertNotVisible:
    id: chat-thinking
- tapOn:
    id: now-cc
- assertVisible:
    id: chat-input
- tapOn:
    id: home-more
- tapOn:
    id: home-saved-inputs
- extendedWaitUntil:
    visible:
      id: topbar-back
    timeout: 10000
- tapOn:
    id: topbar-back
- extendedWaitUntil:
    visible:
      id: chat-input
    timeout: 10000
- assertVisible:
    id: chat-bubble-cc
# Existing dev-e2e build gate; explicit synthetic evidence, no pairing or live API.
- openLink: tendhearth://dev-e2e?op=cc-motion
- runFlow:
    when:
      visible: "Open in “Tendhearth”\\?"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: review-idle
    timeout: 10000
- assertVisible:
    id: cc-phase-idle
- takeScreenshot: cc-alive-app-before-idle
- tapOn:
    id: review-listening
    waitToSettleTimeoutMs: 300
- assertVisible:
    id: cc-phase-listening
- takeScreenshot: cc-alive-app-after-listening
- tapOn:
    id: review-thinking
    waitToSettleTimeoutMs: 300
- assertVisible:
    id: cc-phase-thinking
- takeScreenshot: cc-alive-app-after-thinking
- tapOn:
    id: review-speaking
    waitToSettleTimeoutMs: 300
- assertVisible:
    id: cc-phase-speaking
- takeScreenshot: cc-alive-app-after-speaking
- tapOn:
    id: review-done
    waitToSettleTimeoutMs: 100
- takeScreenshot: cc-alive-app-after-done
- tapOn:
    id: review-look
    waitToSettleTimeoutMs: 100
- takeScreenshot: cc-alive-app-after-topic
- tapOn:
    id: review-away
- takeScreenshot: cc-alive-app-after-away
