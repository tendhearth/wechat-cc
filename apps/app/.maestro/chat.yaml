# 打开直接说话；小 CC 聚焦输入；发送与回复、离开工具后返回同一对话。
appId: com.tendhearth.app
---
- runFlow: subflows/_start.yaml
- tapOn:
    id: welcome-look-first
- extendedWaitUntil:
    visible:
      id: chat-input
    timeout: 10000
- tapOn:
    id: now-cc
- extendedWaitUntil:
    visible:
      id: chat-input
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: chat-input
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: chat-input
    timeout: 5000
- waitForAnimationToEnd
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: chat-input
      - inputText: Maestro hello
      - assertVisible:
          id: chat-send
          enabled: true
# iOS 的 multiline 输入没有通用 hideKeyboard 动作；打开只读模型层再返回收起键盘。
- tapOn:
    id: chat-model-open
- tapOn:
    id: topbar-back
- extendedWaitUntil:
    visible:
      id: chat-input
    timeout: 5000
- tapOn:
    id: chat-send
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: chat-thinking
    timeout: 3000
- extendedWaitUntil:
    visible: .*收到。这是演示模式.*|.*Got it. This is the demo.*
    timeout: 8000
- assertNotVisible:
    id: chat-thinking
- tapOn:
    id: now-cc
- assertVisible:
    id: chat-input
- tapOn:
    id: home-more
- tapOn:
    id: home-saved-inputs
- extendedWaitUntil:
    visible:
      id: topbar-back
    timeout: 10000
- tapOn:
    id: topbar-back
- extendedWaitUntil:
    visible:
      id: chat-input
    timeout: 10000
- assertVisible:
    id: chat-bubble-cc
