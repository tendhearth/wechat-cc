# 演示走一遍:首次打开 → 先看看 → 此刻 → 一起做 → 批准作品集这一步 → 事项 → 展开改动 → 设置 → 切换语言 → 退出演示。
appId: com.tendhearth.app
---
- runFlow: subflows/_start.yaml
- assertVisible:
    id: welcome-pair
- tapOn:
    id: welcome-look-first
# 此刻:CC、具体待回应行和低层级的带回内容;不再重复「N 件事等你」标题,没有填充话。
# 演示里没有执行者在写 ⇒ CC 下面不说它在干什么(没信号不说话)。
- extendedWaitUntil:
    visible:
      id: now-needs-you-card
    timeout: 10000
- assertVisible:
    id: now-cc
- assertNotVisible:
    id: now-cc-status
- assertVisible:
    id: now-needs-you-card
- scrollUntilVisible:
    element:
      id: now-companion-card
    direction: DOWN
- assertVisible:
    id: now-companion-card
- assertNotVisible: ".*(慢慢来|take it slow).*"
- assertVisible:
    id: now-say
- assertVisible:
    id: now-connections
# 欢迎页 replace 回此刻的转场里,第一下点标签偶尔没生效(可能是被原生栈吞掉;真机手点不会这么快);没切过去就再点一次。
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: tab-together
      - extendedWaitUntil:
          visible:
            id: together-item-a1b2c3d4
          timeout: 3000
- assertVisible:
    id: together-item-e5f6a7b8
- assertVisible:
    id: together-item-c9d0e1f2
- tapOn:
    id: together-item-a1b2c3d4
# 待回应行直接打开具体批准;只允许这一步,成功后进入事项,概括按需展开。
- extendedWaitUntil:
    visible:
      id: approval-allow
      enabled: true
    timeout: 10000
- assertVisible:
    id: approval-raw-inline
- tapOn:
    id: approval-allow
- extendedWaitUntil:
    visible:
      id: progress-status
    timeout: 10000
- scrollUntilVisible:
    element:
      id: progress-summary-toggle
    direction: DOWN
- tapOn:
    id: progress-summary-toggle
- assertVisible:
    id: progress-summary
- scrollUntilVisible:
    element:
      id: progress-changes
    direction: DOWN
    centerElement: true
# 标题改成 title 字号后这一行正好停在底边,紧挨着「接着跟 CC 说」;滚到中间再点,别点到说一句
- tapOn:
    id: progress-changes
# 展开后能看到改动的文件。
- extendedWaitUntil:
    visible: "src/pages/home.css"
    timeout: 5000
- scrollUntilVisible:
    element:
      id: progress-process
    direction: UP
    centerElement: true
- tapOn:
    id: progress-process
- scrollUntilVisible:
    element: ".*Projects/portfolio"
    direction: DOWN
# 详情页只有返回;回到此刻再进设置。
- tapOn:
    id: topbar-back
- tapOn:
    id: tab-now
- tapOn:
    id: topbar-settings
- extendedWaitUntil:
    visible:
      id: settings-memory
    timeout: 5000
- scrollUntilVisible:
    element:
      id: settings-language-toggle
    direction: DOWN
- tapOn:
    id: settings-language-toggle
- tapOn:
    id: settings-language-en
- assertVisible: "Settings"
- tapOn:
    id: settings-language-zh-Hans
- assertVisible: "设置"
- scrollUntilVisible:
    element:
      id: settings-privacy-toggle
    direction: DOWN
- tapOn:
    id: settings-privacy-toggle
- assertVisible:
    id: settings-privacy
- scrollUntilVisible:
    element:
      id: settings-exit-demo
    direction: DOWN
- tapOn:
    id: settings-exit-demo
- extendedWaitUntil:
    visible:
      id: welcome-look-first
    timeout: 5000
- assertVisible:
    id: welcome-pair
