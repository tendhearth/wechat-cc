- assertNotVisible:
    id: terminal-detail-allow
- assertNotVisible:
    id: terminal-detail-pending
- assertVisible:
    id: terminal-say-send
    enabled: false
- tapOn:
    id: topbar-back
- extendedWaitUntil:
    visible:
      id: search-work
    timeout: 5000
# 演示执行者会异步做完；返回后核对同一事项的实际最终状态。
