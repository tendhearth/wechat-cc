- runFlow: subflows/_work.yaml
- extendedWaitUntil:
    visible:
      id: row-matter-a1b2c3d4
    timeout: 10000
- scrollUntilVisible:
    element:
      id: row-terminal-demo-cli-api
    direction: DOWN
    centerElement: true
- takeScreenshot: t01-home-back
- scrollUntilVisible:
    element:
      id: row-terminal-demo-cli-blog
    direction: UP
    centerElement: true
- assertVisible:
    id: row-terminal-demo-cli-blog
- takeScreenshot: t01b-now-waiting-terminal
- tapOn:
    id: row-terminal-demo-cli-blog
- extendedWaitUntil:
    visible:
      id: terminal-detail-allow
    timeout: 5000
- assertVisible:
    id: terminal-detail-pending
- assertVisible:
    id: terminal-say-send
    enabled: false
- assertVisible: 它在等你决定，先拍板再说下一句。|It’s waiting for your approval. Decide first,
    then send the next message.
- takeScreenshot: t01c-terminal-waiting
- tapOn:
