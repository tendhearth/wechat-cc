    id: terminal-say-send
    enabled: false
- takeScreenshot: t03-terminal-running
- tapOn:
    id: topbar-back
- tapOn:
    id: chat-search-input
- eraseText
- inputText: api-server
- tapOn:
    id: search-work
- scrollUntilVisible:
    element:
      id: row-terminal-demo-cli-api
    direction: UP
    centerElement: true
- tapOn:
    id: row-terminal-demo-cli-api
- extendedWaitUntil:
    visible:
      id: terminal-detail-summary
    timeout: 5000
- assertNotVisible:
    id: terminal-say-busy
- takeScreenshot: t04-terminal-idle
- tapOn:
    id: terminal-say-input
- inputText: Add one more test
- tapOn:
    id: terminal-say-send
- extendedWaitUntil:
