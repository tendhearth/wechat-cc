# 终端里的会话 + 完成记录(演示模式):此刻直接呈现待回应行,完成记录收在数量入口里,
# 终端那条等批准算进去(点进详情能拍)→ 一起做「终端里的会话」三行(等你批准 / 在跑 / 歇着),每行只有一个动作
# (等批准那行是「看清楚 ›」)→ 在跑那条的详情:说一句是灰的 → 歇着那条的详情:说一句 → 收下
# → 回到一起做,点「看清楚 ›」进详情「允许」→ 那条转成在跑。每一步截图。
appId: com.tendhearth.app
---
- runFlow: subflows/_start.yaml
- tapOn:
    id: welcome-look-first
- extendedWaitUntil:
    visible:
      id: now-look-then-decide
    timeout: 10000
- scrollUntilVisible:
    element:
      id: now-today-counts
    direction: DOWN
    centerElement: true
- takeScreenshot: t01-now-today
# 完成记录在待回应行之后;回到具体终端批准行,点进详情再拍板。
- scrollUntilVisible:
    element:
      id: now-terminal-demo-cli-blog
    direction: UP
    centerElement: true
- assertVisible:
    id: now-terminal-demo-cli-blog
- takeScreenshot: t01b-now-waiting-terminal
- tapOn:
    id: now-terminal-demo-cli-blog
- extendedWaitUntil:
    visible:
      id: terminal-detail-allow
    timeout: 5000
- assertVisible:
    id: terminal-detail-pending
# 等批准时说一句框下的提示是「先拍板」,不是「还在跑」
- assertVisible: "它在等你决定，先拍板再说下一句。|It’s waiting for your approval. Decide first, then send the next message."
- takeScreenshot: t01c-terminal-waiting
- tapOn:
    id: topbar-back
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: tab-together
      - extendedWaitUntil:
          visible:
            id: together-item-a1b2c3d4
          timeout: 3000
- scrollUntilVisible:
    element:
      id: together-terminal
- scrollUntilVisible:
    element:
      id: terminal-item-demo-cli-api
- assertVisible:
    id: terminal-review-demo-cli-blog
- assertNotVisible:
    id: terminal-allow-demo-cli-blog
- assertVisible:
    id: terminal-item-demo-cli-docs
- takeScreenshot: t02-together-terminal
# 在跑那条:说一句的框是灰的,并说明为什么
- tapOn:
    id: terminal-open-demo-cli-docs
- extendedWaitUntil:
    visible:
      id: terminal-activity
    timeout: 5000
- assertVisible:
    id: terminal-say-busy
- assertVisible:
    id: terminal-say-send
    enabled: false
- takeScreenshot: t03-terminal-running
- tapOn:
    id: topbar-back
# 歇着那条:接着说一句
- scrollUntilVisible:
    element:
      id: terminal-open-demo-cli-api
- tapOn:
    id: terminal-open-demo-cli-api
- extendedWaitUntil:
    visible:
      id: terminal-detail-summary
    timeout: 5000
- assertNotVisible:
    id: terminal-say-busy
- takeScreenshot: t04-terminal-idle
- tapOn:
    id: terminal-say-input
- inputText: "再加一条测试"
- tapOn:
    id: terminal-say-send
- extendedWaitUntil:
    visible:
      id: terminal-detail-note
    timeout: 5000
- assertVisible:
    id: terminal-say-busy
- takeScreenshot: t05-terminal-sent
- tapOn:
    id: topbar-back
# 看清楚 › 进详情再允许:等批准那条转成在跑
- scrollUntilVisible:
    element:
      id: terminal-review-demo-cli-blog
- tapOn:
    id: terminal-open-demo-cli-blog
- extendedWaitUntil:
    visible:
      id: terminal-detail-allow
    timeout: 5000
- tapOn:
    id: terminal-detail-allow
- extendedWaitUntil:
    visible:
      id: terminal-detail-note
    timeout: 5000
- assertVisible: "好了，它在终端里接着做。|Done. It’s carrying on in the terminal."
- tapOn:
    id: topbar-back
- extendedWaitUntil:
    notVisible:
      id: terminal-review-demo-cli-blog
    timeout: 5000
- takeScreenshot: t06-together-allowed
