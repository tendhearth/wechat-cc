    direction: DOWN
    centerElement: true
- assertVisible:
    id: row-terminal-demo-cli-docs
- takeScreenshot: t02-all-terminal
# 用搜索定位目标，避免把固定搜索栏下面已裁剪的无障碍行当成可点击行。
- tapOn:
    id: chat-search-input
- inputText: docs
- tapOn:
    id: search-work
- scrollUntilVisible:
