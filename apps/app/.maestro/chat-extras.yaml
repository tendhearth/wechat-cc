# T5: 原有功能验收移到唯一对话、搜索引用与原详情。
appId: com.tendhearth.app
---
- runFlow: subflows/_start.yaml
- tapOn:
    id: welcome-look-first
- extendedWaitUntil:
    visible:
      id: chat-input
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: chat-input
    timeout: 5000
- waitForAnimationToEnd
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: chat-input
      - inputText: Maestro extras
      - assertVisible:
          id: chat-send
          enabled: true
- hideKeyboard
- tapOn:
    id: chat-send
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: .*(演示模式|This is the demo).*
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: chat-process-toggle
    timeout: 10000
- assertVisible:
    id: chat-process-toggle
- assertNotVisible:
    id: chat-process-lines
- assertVisible:
    id: chat-att-voice
- assertVisible:
    id: chat-att-sticker
- assertVisible: .*(表情 · 加油|Sticker · cheer).*
- tapOn:
    id: chat-process-toggle
- assertVisible:
    id: chat-process-lines
- assertVisible: .*(没有发到微信|not sent to WeChat).*
- tapOn:
    id: chat-att-voice
- assertNotVisible:
    id: chat-att-voice-failed
- runFlow: subflows/_topics.yaml
