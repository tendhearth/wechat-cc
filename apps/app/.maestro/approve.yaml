# T5: 原有功能验收移到唯一对话、搜索引用与原详情。
appId: com.tendhearth.app
---
- runFlow: subflows/_start.yaml
- tapOn:
    id: welcome-look-first
- runFlow: subflows/_work.yaml
- extendedWaitUntil:
    visible:
      id: row-matter-a1b2c3d4
    timeout: 10000
- tapOn:
    id: row-matter-a1b2c3d4
- extendedWaitUntil:
    visible:
      id: approval-title
    timeout: 10000
- assertVisible:
    text: 可以安装图片处理组件吗？|May I add an image-processing package\?
- assertVisible:
    id: approval-model-note
- assertVisible:
    id: approval-operation-command
- extendedWaitUntil:
    visible:
      id: approval-allow
      enabled: true
    timeout: 10000
- assertVisible:
    id: approval-cc-opinion
- takeScreenshot: approve-opinion
- tapOn:
    id: approval-allow
- extendedWaitUntil:
    visible:
      id: progress-status
    timeout: 10000
- extendedWaitUntil:
    visible: 这一轮做完了|Done for this round
    timeout: 8000
- openLink: "tendhearth://dev-e2e?op=approval-kinds"
# 开发构建打开深链时系统会问一句「Open in "Tendhearth"?」
- runFlow:
    when:
      visible: "Open in “Tendhearth”\\?"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: approval-operation-command
    timeout: 10000
- assertVisible:
    text: 可以运行这条命令吗？|May I run this command\?
- takeScreenshot: approve-kinds-1
- scrollUntilVisible:
    element:
      id: approval-operation-edit
    direction: DOWN
    centerElement: true
- takeScreenshot: approve-kinds-2
- scrollUntilVisible:
    element:
      id: approval-operation-patch
    direction: DOWN
    centerElement: true
- takeScreenshot: approve-kinds-3
- scrollUntilVisible:
    element:
      id: approval-operation-text
    direction: DOWN
- takeScreenshot: approve-kinds-4
