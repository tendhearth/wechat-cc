<main>
  <header><h1>CC · 同一个小伙伴</h1><p>暖纸底、深炭色。把角色留在图标里。</p></header>
  <section class="hero" aria-label="应用图标在浅色和深色背景上">
    <div class="tile"><img src="app-icon.svg" alt="CC 应用图标"><span>浅色桌面</span></div>
    <div class="tile dark"><img src="app-icon.svg" alt="CC 应用图标"><span>深色桌面</span></div>
  </section>
  <section class="section"><h2>小尺寸</h2><div class="sizes">
    <figure><img src="../../src/wechat-cc-logo.png" width="16" height="16" alt="16 像素图标"><figcaption>16</figcaption></figure>
    <figure><img src="../../src/assets/brand/cc-mark.svg" width="20" height="24" alt="标题栏标记"><figcaption>标题栏 · 24</figcaption></figure>
    <figure><img src="../../src/wechat-cc-logo.png" width="32" height="32" alt="32 像素图标"><figcaption>32</figcaption></figure>
    <figure><img src="../../src/wechat-cc-logo.png" width="48" height="48" alt="48 像素图标"><figcaption>48</figcaption></figure>
    <figure><img src="../../src/wechat-cc-logo.png" width="64" height="64" alt="64 像素图标"><figcaption>64</figcaption></figure>
    <figure><img src="../../src/wechat-cc-logo.png" width="96" height="96" alt="96 像素图标"><figcaption>96</figcaption></figure>
  </div></section>
  <section class="section"><h2>放进界面</h2><div class="examples">
    <div class="side"><div class="lockup"><img src="../../src/assets/brand/cc-mark.svg" alt="">CC</div><p class="note">一起生活，也一起做事</p><div class="nav">此刻<br>一起做<br>回忆</div></div>
    <div class="window"><div class="top"><div class="dots"><i></i><i></i><i></i></div><img src="../../src/assets/brand/cc-mark.svg" alt="CC">一起做</div><div class="body"><div class="list">任务<p>首页改版</p><p>整理发布说明</p></div><div class="conversation"><strong>首页改版</strong>改动已经整理好了，你可以直接查看。</div></div></div>
  </div></section>
  <p class="foot">这里是图标尺寸与界面搭配预览。桌宠仍使用已冻结的原始资产。</p>
