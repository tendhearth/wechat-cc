<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>CC · AI 服务连接</title><link rel="stylesheet" href="../../src/styles.css"><link rel="stylesheet" href="../../src/cc-surfaces.css"><style>body{display:block;padding:40px;max-width:860px;margin:auto;height:auto;overflow:auto}header{margin-bottom:32px}button{cursor:pointer}#brain-health{margin-top:24px}.provider-switch{padding:12px;border-radius:14px;border:1px solid #dfd4c3;background:#fffaf1}nav{display:flex;gap:14px;margin:24px 0}#provider-menu{z-index:10}</style><header><h1>CC 的 AI 服务</h1><p>连接方式与技术细节收进设置，首页只呈现当前服务。</p></header><button class="provider-switch">当前使用：Claude · 更换</button><div id="provider-menu" hidden></div><nav><button id="setup">连接其他 AI 服务</button><button id="check">检查当前连接</button></nav><div id="brain-health" class="brain-health" hidden></div><p style="margin-top:30px;color:#8b7968">交互样板 · 使用模拟状态，不修改真实账号、不发送测试请求。</p><script type="module">
import {toggleProviderMenu,closeProviderMenu,renderNoBrain,runTroubleshoot,runBrainDial,openBrainSetup} from '../../src/modules/dashboard.js';
const deps={invokeApi:async(method,path)=>path.includes('net/probe')?{ok:true,verdict:'ok',results:[{label:'基础网络',ok:true,latency_ms:25},{label:'当前服务',ok:true,latency_ms:120}]}:{ok:true,registered:['claude','codex'],default_provider:'claude',results:path.includes('fresh')?[{provider:'claude',ok:true}]:[]}};
document.querySelector('.provider-switch').onclick=()=>toggleProviderMenu(deps,{checks:{provider:{provider:'claude'}}});
document.querySelector('#setup').onclick=()=>renderNoBrain(deps,true);
document.querySelector('#check').onclick=()=>runTroubleshoot(deps);
document.addEventListener('click',e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(a==='connect-ai'){closeProviderMenu();renderNoBrain(deps,true)}if(a==='brain-dial')runBrainDial(deps);if(a==='brain-troubleshoot')runTroubleshoot(deps);if(a==='nb-apikey')openBrainSetup(deps,'openai');if(a==='nb-cli')openBrainSetup(deps,'claude');if(a==='brain-close')document.querySelector('#brain-health').hidden=true});
renderNoBrain(deps,true);
</script></html>
