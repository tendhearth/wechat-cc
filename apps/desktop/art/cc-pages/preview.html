<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/apps/desktop/src/"><title>CC 页面插画对照</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="cc-page-art.css"><style>html{overflow:auto;height:auto}body{overflow:auto;height:auto;min-height:100vh;padding:24px;background:#fffaf0;color:#593f2c}main{max-width:960px;margin:auto}.samples{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}section{padding:20px;border:1px solid #e2d2bb;border-radius:14px}h1{font-size:24px}h2{font-size:16px}.memory-sample{margin-top:24px}.memory-sample .cc-page-art{max-width:760px;margin:auto}</style><main><h1>CC 页面插画对照</h1><p>使用产品相同的样式和冻结角色；记忆区为视觉预览，不连接真实记忆数据。</p><div class="samples"><section id="prepare"><h2>首次设置 · 准备</h2></section><section id="ready"><h2>首次设置 · 就绪</h2></section><section id="chat"><h2>跟 CC 说</h2></section></div><section class="memory-sample" id="memory"><h2>记忆 · 纸笺与植物</h2></section></main><script type="module">import {ccPageArt} from './cc-page-art.js';document.querySelector('#chat').insertAdjacentHTML('beforeend',ccPageArt('chat'));document.querySelector('#memory').insertAdjacentHTML('beforeend',ccPageArt('memory'));const source=new DOMParser().parseFromString(await(await fetch('./index.html')).text(),'text/html');document.querySelector('#prepare').append(source.querySelector('.launch-illus-missing .cc-page-art'));document.querySelector('#ready').append(source.querySelector('.launch-illus-ready .cc-page-art'));</script></html>
