[package]
name = "wechat_cc_desktop"
version = "1.7.8"
description = "wechat-cc desktop installer"
authors = ["wechat-cc"]
edition = "2021"

[lib]
name = "wechat_cc_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
qa-webdriver = ["dep:tauri-plugin-wdio-webdriver", "dep:objc2-app-kit", "dep:objc2-foundation"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The companion window uses transparent pixels around the hand-painted tank.
# Tauri exposes that native macOS capability behind this opt-in feature.
# Wry 0.57.1+ fixes macOS file-reference drags without legacy pasteboard paths (#1844).
tauri = { version = "2.12.5", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# System URL launches await their initial status without blocking the webview.
# The debug-only dev-hot-reload sidecar path also uses Tokio process support.
tokio = { version = "1", features = ["process", "io-util", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-wdio-webdriver = { version = "=1.5.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "NSEvent", "NSGraphicsContext", "NSResponder", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "NSGeometry"] }

[dev-dependencies]
libc = "0.2"
tauri = { version = "2.12.5", features = ["test"] }
