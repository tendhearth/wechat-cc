
<section class="home-scene" aria-label="CC 此刻">
  <h2 id="pres-txt">正在看看 CC…</h2>
  <p id="home-context"></p>
  <div class="home-character" role="button" tabindex="0" aria-label="看看 CC 眼中的你">
    <img class="home-dark" alt="">
    <img class="home-light" alt="">
  </div>
</section>
<div id="home-focus" aria-live="polite"></div>
<!-- 终端里等你批准的(today.js 从「今天」那份数据里挑出来),和上面那张卡一起是「等你的事」。 -->
<div id="today-waiting" aria-label="终端里等你批准" hidden></div>
<div id="home-result"></div>
<!-- 今天(2026-10-14):终端 + 一起做,过去 24 小时的几个数(不含等你的)与最近做完的三件;与微信「日报」同一份。放在等你的事下面。 -->
<section id="today-root" aria-label="过去 24 小时" hidden>
  <button id="today-counts-open" class="today-head" type="button"><small id="today-title">过去 24 小时</small><strong id="today-counts"></strong><span id="today-partial" hidden>有一部分暂时读不到</span></button>
  <div id="today-list"></div>
</section>
<!-- CC 做过的事(B9,2026-10-20):点开才拉,activity.js。 -->
<section id="activity-root" aria-label="CC 做过的事">
  <button id="activity-open" class="today-head" type="button" aria-expanded="false"><small>CC 做过的事 ›</small></button>
  <div id="activity-body" hidden>
    <span id="activity-partial" class="m-note" hidden>有一部分暂时读不到</span>
    <div id="activity-list"></div>
    <button id="activity-more" class="home-quiet" type="button" hidden>再早一点</button>
  </div>
</section>
<button id="memory-open" class="home-quiet" type="button">回忆 ↗</button>
