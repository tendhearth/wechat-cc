<section id="conversation" aria-label="和 CC 说话" hidden>
  <div class="conversation-tools"><button id="chat-search-open" type="button">搜索</button><button id="chat-refresh" type="button">刷新</button></div>
  <p id="chat-notice" role="status" aria-live="polite"></p>
  <button id="chat-older" type="button" hidden>更早的消息</button>
  <section id="chat-search" role="dialog" aria-label="搜索对话和事项" hidden><button id="chat-search-close" type="button">返回对话</button><form id="chat-search-form"><label>搜索对话或事项<input id="chat-query" type="search" maxlength="200"></label><label>项目<input id="chat-project" type="search" maxlength="1024"></label><label>类型<select id="chat-kind"><option value="task">交办的事</option><option value="terminal">终端会话</option></select></label><label>状态<select id="chat-filter"><option value="">全部状态（含归档）</option value="waiting">等你决定</option><option value="working">在做</option><option value="done">完成</option><option value="failed">没做成</option><option value="cancelled">停下了</option><option value="archived">已归档</option></select></label><button type="submit">查找</button></form><div id="chat-search-results"></div><button id="chat-search-more" type="button" hidden>更多历史事项</button></section>
  <div id="chat-messages" role="log" aria-label="主人与 CC 的对话"></div>
  <button id="chat-waiting" type="button" hidden></button>
  <div id="topic-row" role="group" aria-label="最近话题" hidden></div>
  <form id="chat-form"><label for="chat-input" class="sr-only">跟 CC 说一句</label><textarea id="chat-input" rows="2" maxlength="20000" placeholder="跟 CC 说一句…"></textarea><button id="chat-send" type="submit">发送</button></form>
  <section id="topic-panel" role="dialog" aria-label="话题" hidden>
    <button id="topic-close" type="button">收起 · 返回对话</button>
    <p id="topic-notice" role="status" aria-live="polite"></p><button id="topic-retry" type="button">重试</button>
    <div id="topic-all" hidden><h2>更多话题</h2><label>搜索话题<input id="topic-query" type="search"></label><div id="topic-list"></div><button id="topic-list-more" type="button" hidden>更多话题</button></div>
    <div id="topic-body"></div>
  </section>
</section>
