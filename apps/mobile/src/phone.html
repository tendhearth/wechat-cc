<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CC</title>
<link rel="manifest" href="/m/manifest.json">
<link rel="apple-touch-icon" href="/m/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
{{>tokens.css}}
  * { box-sizing:border-box }
  body { margin:0; font-family:var(--font); background:var(--paper); color:var(--ink); padding-bottom:70px }
  /* 层级靠字号与留白,不靠粗细:浏览器默认把 b / strong / 标题加粗到 700,这里统一收到中等(500)。 */
  b, strong, h1, h2, h3, h4, th { font-weight:500 }
  header { padding:18px 16px 8px } header h1 { font-size:22px; margin:0 }
  .pane { padding:8px 14px 20px; display:none } .pane.on { display:block }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r-m); padding:12px 14px; margin-bottom:10px }
  .todo { display:flex; align-items:center; gap:10px }
  .todo .tx { flex:1; min-width:0 } .todo .tx b { font-size:14px; font-weight:500; display:block }
  .todo .tx small { color:var(--soft) }
  .todo .th-agents { --th-agent-ring:var(--card) }
  .todo .th-origin { --th-origin-size:14px; margin-right:-4px }
  .m-agents { display:flex; align-items:center; gap:8px; margin:-2px 2px 8px; color:var(--soft); font-size:13px } .m-agents[hidden] { display:none }
  .grp { color:var(--ink); font-size:13px; font-weight:500; margin:14px 2px 6px }
  .empty { text-align:center; color:var(--soft); padding:40px 10px }
  nav { position:fixed; left:0; right:0; bottom:0; display:flex; background:var(--card); border-top:1.5px solid var(--line); padding-bottom:env(safe-area-inset-bottom) }
  nav button { flex:1; font:inherit; font-size:12px; padding:10px 0 8px; border:0; background:none; color:var(--soft) }
  nav button.on { color:var(--ink); font-weight:500 }
  #pairbar { margin:8px 14px; padding:9px 12px; background:var(--wash); border-radius:var(--r-s); font-size:12.5px; color:var(--soft) }
  #pairbar button { font:inherit; font-size:12.5px; margin-left:8px; padding:4px 12px; border:1.5px solid var(--accent); border-radius:var(--r-pill); background:var(--accent); color:var(--on-accent) }
  #toast { position:fixed; left:50%; bottom:76px; transform:translateX(-50%); background:var(--ink); color:var(--card); padding:7px 16px; border-radius:var(--r-l); font-size:12.5px; opacity:0; transition:.25s; pointer-events:none }
  #toast.show { opacity:1 }
  #banner { margin:6px 14px; padding:8px 12px; background:var(--wash); border-radius:var(--r-s); font-size:12.5px; color:var(--ink) }
  .more { display:block; margin:6px auto 0; font:inherit; font-size:13px; padding:7px 18px; border:1.5px solid var(--line); border-radius:var(--r-pill); background:var(--card); color:var(--soft) }
  #m-list button.card { width:100%; text-align:left; font:inherit; color:inherit }
  #m-notice { padding:8px 0; white-space:pre-wrap } #m-notice:empty { display:none }
  #m-conn { padding:8px 10px; margin:8px 0; border:1px solid var(--line); border-radius:var(--r-s); font-size:.92em; opacity:.85 }
  #m-status p { margin:8px 0; overflow-wrap:anywhere } #m-status .m-state { font-size:17px; color:var(--ink) }
  #m-status .m-now span { font-weight:500; margin-right:4px } #m-status .m-task-note, .m-elsewhere { color:var(--soft); font-size:13px }
  #m-status button { display:inline-block; min-height:44px; margin:8px 0 0; padding:9px 16px; border-radius:var(--r-s); color:var(--ink) }
  #m-status button:disabled { opacity:.5 } #m-status :focus-visible { outline:2px solid var(--accent); outline-offset:3px }
</style></head><body>
<header><h1>CC</h1><button id="nav-set" type="button" aria-label="设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1z"/><circle cx="12" cy="12" r="3"/></svg><span>设置</span></button></header>
<div id="pairbar" hidden>这个链接 10 分钟就过期<button id="pairbtn">把 CC 带在身上</button></div>
<div class="pane on" id="p-today">
  <div class="home-toolbar"><button id="refresh" type="button" aria-label="刷新状态"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M5 8a8 8 0 0 1 13-2l2 6M4 12l2 6a8 8 0 0 0 13-2"/></svg><span>刷新</span></button></div>
  <div id="banner" hidden></div>
  {{>presence.html}}
</div>
<div class="pane" id="p-matters">
  <!-- 网页只看状态(收敛 5b,2026-10-21):交办、接着说、拍板、成果、对话记录都在 App 和电脑上。 -->
  <!-- 连接提示:平时不在,连续两次联系不上 daemon 才浮出来,恢复后自己消失。放在列表与详情之外,两边共用同一行。 -->
  <div id="m-conn" role="status" aria-live="polite" hidden></div>
  <div id="m-list"><div class="empty">正在读…</div></div>
  <div id="m-detail" hidden>
    <button id="m-back" class="more" type="button">← 全部</button>
    <div class="grp" id="m-title"></div>
    <div class="m-agents" id="m-agents" hidden></div>
    <div id="m-notice" role="status" aria-live="polite"></div>
    <section id="m-status" aria-label="现在到哪了" aria-live="polite"></section>
    <p class="m-elsewhere">对话记录、成果和拍板在手机 App 或电脑上看。</p>
  </div>
</div>
<nav>
  <button type="button" data-p="today" class="on" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8M5 9v12h14V9M9 21v-7h6v7"/></svg><span>此刻</span></button>
  <button type="button" data-p="matters"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="15" rx="2"/><path d="M9 6V3h6v3M4 11h16M10 11v3h4v-3"/></svg><span>一起做</span></button>
</nav>
<style>{{>presence.css}}</style>
<style>{{>agent-avatars.css}}</style>
<div id="toast"></div>
<script>
var T = {{TOKEN_JSON}}
var REMOTE = {{REMOTE_JSON}}{{>boot.js}}{{>transport.js}}{{>nav.js}}{{>workbench.js}}
{{>presence.js}}{{>home.js}}</script></body></html>
