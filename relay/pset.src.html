<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CC</title>
<!--
  pset — 公网引导壳 (2026-08-26)。部署在中继 VPS 的静态目录,解决
  「手机走流量扫不开 LAN 二维码」:壳从公网加载,真正的页面通过 E2E
  隧道取回注入。锚点携带 id/令牌 —— # 后的内容不发给服务器,中继
  连令牌都看不到;页面数据全程密文,中继盲转。
  流程:解析 hash → 隧道握手(HKDF salt=令牌)→ 密文取页 →
  注入 window.__CC_SHELL__ 后 document.write(页面自身的传输层看到
  壳标记即强制走隧道)。
  2026-09-24 删掉「先探 LAN」:家里直接用电脑,手机网页只在外面用;
  而且 https 页里探 http 私网地址会被现代浏览器拦,探测几乎总失败,白等 2s。
  链接里的 lan= 参数保留但不再使用。
  2026-10-25(架构终态 F4):v1 退休。壳跟原生 App、手机网页用同一个协议客户端
  CCP.makeProtocolClient(packages/protocol,构建期由 apps/mobile/build.ts 打包塞进下面
  script 顶部那处占位注释)说 v2,握手自报 client:"web";只连中继 v2 的 /v2/phone。链接
  里是老中继 id(t…)、或 daemon 回 upgrade_required ⇒ 提示在电脑上重新扫码配对。本页运行
  的沙箱可以没有 crypto.subtle(只要有 crypto.getRandomValues / TextEncoder /
  TextDecoder / WebSocket)。改的是 relay/pset.src.html 这份源码;relay/pset.html 是
  `bun run build:mobile` 写出的生成物,别手改。占位注释的确切写法只在 script 里出现这一
  处,别在别的注释里重复打(build.ts 用字符串 replace,认第一处)。
-->
<style>
  /* 色值与 apps/mobile/src/tokens.css 保持一致(壳页单独部署,不能引用它;src/daemon/design-tokens.test.ts 守着) */
  body { margin:0; font-family:"TH Serif 4","Noto Serif SC","Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",Georgia,serif; background:#faf7f2; color:#2a2622; display:grid; place-items:center; min-height:100svh }
  .box { box-sizing:border-box; text-align:center; padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom)); width:100%; max-width:360px; overflow-wrap:anywhere }
  .box .b { color:#4f6b4f; font-size:26px; font-weight:500; margin:0 auto 14px }
  .box .hand { color:#70665d; font-size:15px; margin:0 0 6px }
  .box p { color:#70665d; font-size:14px; line-height:1.7; margin:0 }
</style></head><body>
<div class="box"><div class="b" aria-hidden="true">CC</div><p class="hand">随身 CC</p><p id="msg">正在找回家的路…</p></div>
<script>
/*@@CCP@@*/
var P = {}
location.hash.slice(1).split("&").forEach(function(kv){ var i = kv.indexOf("="); if (i > 0) P[kv.slice(0,i)] = decodeURIComponent(kv.slice(i+1)) })
var ID = P.id, LINK_T = P.t, T = P.t, PATH = P.p || "/m"
// 配对过的手机:设备令牌存在本域 localStorage(注入页写的),永不过期 ——
// 优先于 hash 里可能已过期的 10 分钟短令牌。加主屏后重开因此总能进。
// 令牌绑在发它的那台电脑(中继 id)上(2026-10-10):中继是所有人共用的一个域,别人的配对链接
// (#id=<他的电脑>)也能打开这个壳页 —— 只用、只删属于这台电脑的那枚。老手机存的令牌没记 id:照用,
// 但别的链接说 auth_failed 时不删(打开一次成功后页面会补记 id)。
var DT_ID = null
try { var dt = localStorage.getItem("deviceToken"); DT_ID = localStorage.getItem("deviceTokenId"); if (dt && (!DT_ID || DT_ID === ID)) T = dt } catch (e) {}
var msg = document.getElementById("msg")
if (!ID || !T) { msg.textContent = "链接不完整,回微信跟 CC 再要一个" }

var REPAIR = "连接方式升级了，请在电脑上重新扫码配对"
var EXPIRED = "这个链接已经用过或过期了，回微信跟 CC 再要一个"
var TAMPERED = "家里的电脑暂时连不上（连接在半路被改过），过一会儿再试"

/** 浏览器 WebSocket → 协议客户端要的 ProtocolSocket。 */
function socket(url) {
  var ws = new WebSocket(url), onOpen = null, onMsg = null, onClose = null
  ws.onopen = function() { if (onOpen) onOpen() }
  ws.onmessage = function(ev) { if (onMsg) onMsg(typeof ev.data === "string" ? ev.data : String(ev.data)) }
  ws.onclose = function() { if (onClose) onClose() }
  ws.onerror = function() { try { ws.close() } catch (e) {} }
  return {
    send: function(s) { ws.send(s) }, close: function() { try { ws.close() } catch (e) {} },
    onOpen: function(cb) { onOpen = cb }, onMessage: function(cb) { onMsg = cb }, onClose: function(cb) { onClose = cb },
  }
}

// 老中继(t… id)随 v1 退休:连不上了。丢掉绑在它上面的设备令牌,说清楚怎么重新配对。
function needsRepair() {
  try { var dt = localStorage.getItem("deviceTokenId"); if (dt && dt.charAt(0) === "t") { localStorage.removeItem("deviceToken"); localStorage.removeItem("deviceTokenId") } } catch (e) {}
  msg.textContent = REPAIR
}

function viaTunnel() {
  msg.textContent = "从远处连回你的电脑…(加密直达)"
  var relay = "wss://" + location.host + "/v2/phone"
  var cli = CCP.makeProtocolClient({
    open: function() { return socket(relay + "?id=" + encodeURIComponent(ID)) },
    token: T, client: "web", retries: 0,
    // 中继把握手里的 v 抹掉:客户端拒绝降级、按退避自己再试;配对原样留着,只说一声。
    onProtocolError: function(reason) { if (reason === "downgrade_refused" && !settled) { tampered = true; msg.textContent = TAMPERED } },
  })
  var settled = false, tampered = false
  function done() { if (settled) return false; settled = true; clearTimeout(timer); try { cli.close() } catch (e) {} ; return true }
  var timer = setTimeout(function(){ if (done()) msg.textContent = tampered ? TAMPERED : "连不上家里的电脑 — 看看它开着没、CC 在跑没" }, 20000)
  cli.request({ method: "GET", path: PATH + "?t=" + T }).then(function(r) {
    if (!done()) return
    if (r.status === 401) { msg.textContent = EXPIRED; return }
    if (r.status !== 200) { msg.textContent = "打开失败(" + r.status + "),稍后再试"; return }
    var shell = { relay: relay, id: ID }
    var html = r.text().replace(/<script>/, "<scr" + "ipt>window.__CC_SHELL__=" + JSON.stringify(shell) + ";</scr" + "ipt><scr" + "ipt>")
    document.open(); document.write(html); document.close()
  }, function(err) {
    if (!done()) return
    var code = err && err.message
    if (code === "auth_failed") {
      // 本域存的设备令牌不被认了(解除配对 / 换了电脑):丢掉它,用链接里的短令牌重来一次。
      if (T !== LINK_T && LINK_T) { if (DT_ID === ID) { try { localStorage.removeItem("deviceToken"); localStorage.removeItem("deviceTokenId") } catch (e) {} } T = LINK_T; settled = false; viaTunnel(); return }
      msg.textContent = EXPIRED; return
    }
    if (code === "upgrade_required") { needsRepair(); return }
    if (tampered) { msg.textContent = TAMPERED; return }
    msg.textContent = code === "daemon_offline" ? "家里的 CC 不在线 — 电脑开着吗?" : code === "unreachable" || code === "timeout" ? "网络不给力,稍后再试" : ("连接出错:" + code)
  })
}

if (ID && ID.charAt(0) === "t") needsRepair()
else if (ID && T) viaTunnel()
</script></body></html>
