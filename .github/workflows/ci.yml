name: CI

on:
  push:
    # `dev` is included so the essential gate (typecheck + unit tests + build)
    # runs on the integration branch too — it sat uncovered while 91 commits
    # piled up, which is how type errors accumulated unnoticed. The heavy e2e
    # jobs below stay master/PR-only to keep routine dev pushes fast.
    #
    # `self/**` 是自改流水线(spec 2026-09-18-self-change-pipeline)推的分支:
    # CC 自己给自己改一版,先推 self/<题目>,CI 绿才是它进 dev 的闸门。漏了这一
    # 行,那道闸门就根本不存在 —— 而且是**安静地**不存在(推上去一条运行都没有,
    # 看上去和「跑完了还没红」一模一样)。
    branches: [master, dev, 'self/**']
  pull_request:
    # dev 也在内:CI 只在 push 后跑等于永远事后 —— 2026-09-11~14 有 69 条提交
    # 在本地攒了三天才到 dev,期间一次没验。重型 e2e 仍按 base_ref 限定在 master。
    branches: [master, dev]

jobs:
  # 只为算一件事:这一推里 apps/desktop/** 动没动过。
  #
  # 为什么要有它:desktop-e2e 一次约 3 分钟,以前只在 master / PR 上跑,于是在
  # dev 上改了桌面要等到合并前才知道红,而「合并前本地跑一遍 Playwright」的规矩
  # 靠自觉。有了这个输出,改了桌面的 dev 推送也跑 desktop-e2e,没改的照旧跳过 ——
  # 多付的那 3 分钟只落在真的动过桌面的那些推送上。
  changes:
    name: changes · paths
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      relay: ${{ steps.filter.outputs.relay }}
      app: ${{ steps.filter.outputs.app }}
      app_native: ${{ steps.filter.outputs.app_native }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            desktop:
              - 'apps/desktop/**'
            relay:
              - 'apps/relay/**'
              - 'packages/protocol/**'
              - 'relay/pset.src.html'
            app:
              - 'apps/app/**'
              - 'packages/protocol/**'
            app_native:
              - 'apps/app/native/**'
              - 'packages/protocol/**'

  build:
    name: build · ${{ matrix.os }}
    strategy:
      # Let every platform complete so we can see which ones break at a
      # glance instead of the first failure cancelling the rest.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # 钉死,不用 latest:2026-09-15 上游发到 1.4.2,CI 在没有任何提交的情况下
          # 自己变红(db.test.ts 的 v53 迁移)。升级 bun 该是一件有人盯着的事。
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The embedding-equivalence test (js-embedder.e2e.test.ts) needs the real
      # ~90MB ONNX model. Without a cache it would either re-download on every
      # run or — worse — silently skip, and a silently skipping equivalence
      # check is exactly how you switch embedding runtimes on a false green.
      # Keyed on the model id so a model change is a cache miss, not a stale hit.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/wechat-cc/transformers
          key: transformers-Xenova-bge-small-zh-v1.5-v1

      # Populate the cache on a miss. Without this the first run has no model,
      # the equivalence test skips, nothing downloads it, and an empty cache is
      # saved — so it would skip on every subsequent run too. No-op on a hit.
      - name: Prefetch embedding model
        run: >
          bun -e "import { makeJsEmbedder } from './src/core/knowledge/js-embedder.ts';
          await makeJsEmbedder({ model_id: 'bge-small-zh-v1.5' }).embed(['warm'])"

      - name: Typecheck
        # 独立于前面的检查:一条红不该让后面几条一次都不执行。
        if: ${{ !cancelled() }}
        run: bun run typecheck

      - name: Module-boundary check
        # Fast layer-violation guard. Runs only on linux to keep matrix
        # parallelism cheap — the rules are platform-independent.
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: bun run depcheck

      - name: Build cli.ts
        if: ${{ !cancelled() }}
        # --outdir rather than --outfile: kept from the days the workbench bundled
        # `*-native.c` file assets (gone since 2026-09-16, the file layer is pure
        # JS now); --outdir still works and is what the release path exercises.
        run: bun build cli.ts --target=node --outdir dist

      - name: Build docs.ts
        if: ${{ !cancelled() }}
        run: bun build docs.ts --target=node --outfile=dist/docs.js

      - name: Build setup.ts
        if: ${{ !cancelled() }}
        run: bun build setup.ts --target=node --outfile=dist/setup.js

      - name: Compiled-sidecar smoke
        # Proves guardrail #1 (compiled sidecar delegates LLM memory ops to
        # the daemon instead of inline-spawning claude, which crashes under
        # bunfs) against a real `bun build --compile` artifact, not just
        # source-mode unit tests. Linux-only to keep matrix parallelism cheap
        # — the guardrail logic is platform-independent.
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: bun scripts/smoke-compiled-sidecar.ts

      - name: Run tests
        if: ${{ !cancelled() }}
        # `bun run test` invokes `bun --bun vitest run` per package.json
        # (PR7 — vitest needs Bun's runtime to resolve `bun:sqlite`).
        run: bun run test

  # 「换运行时的出口是真的」的证明:同一套单元测试(整个 src,只差 Bun.serve 上的 ws 服务端)
  # 在 Node 24 上跑。2026-09-16 起步时 lib + core 是 2765 过 / 38 红;适配层补齐后同日整个 src
  # 全绿,于是改成必绿 —— 以后谁在业务代码里直接用 Bun.*,这里和 no-bun-globals.test 一起红。
  node:
    name: node · core suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Unit tests under Node (whole src, minus the ws server)
        # 走 npm script 而不是直接敲 node_modules/.bin/vitest:npm 会把 node_modules/.bin 加进 PATH,
        # bootstrap 的 codex 探测(find-codex-binary)靠它找到 SDK 自带的 codex —— bun run 也是这么做的。
        run: npm run test:node -- --reporter=dot

  # 官方中继 v2(apps/relay,Cloudflare Workers)。测试跑在本地 workerd 里,只在 Linux 上跑一份;
  # 只在中继、协议包或壳页源码动过时跑(跟 desktop-e2e 同一个 changes 输出机制)。
  relay:
    name: relay · workers
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: apps/relay
        run: bun run typecheck
      - name: Unit (workerd)
        working-directory: apps/relay
        run: bun run test
      - name: End-to-end (local workerd + daemon modules)
        working-directory: apps/relay
        run: bun run test:e2e

  # Tendhearth 手机 app(apps/app,Expo)。只做类型检查、纯逻辑测试与 JS 打包检查;原生构建走 EAS,不进每次 CI。
  app:
    name: app · expo
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: apps/app
        run: bun run typecheck
      - name: Unit
        working-directory: apps/app
        run: bun run test
      - name: Bundle check
        working-directory: apps/app
        run: bun run export:check

  # 推送解密的原生两端跑协议包的同一份向量(spec §9.3)。只在 apps/app/native/** 或协议包动过时跑。
  # macOS runner 自带 Swift / Xcode;Kotlin 走 JVM(test.sh 用 PATH 上的 gradle 与 JAVA_HOME)。
  app-native:
    name: app · native push vectors
    needs: changes
    if: needs.changes.outputs.app_native == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift (CryptoKit)
        working-directory: apps/app/native/ios-notify
        run: swift test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Kotlin (JVM)
        run: apps/app/native/android-push/test.sh

  e2e:
    # 也跑在进 dev 的 PR 上(2026-10-04):#197 把两条 e2e 弄红,因为这一作业只在 base=master 时跑,
    # 红了两天没人知道,直到下一次发版 PR 才会砸下来。这套只有 27 个文件 / 49 条,代价可接受。
    # 直接推 dev 仍跳过(PR 那一步已经跑过)。
    if: github.base_ref == 'master' || github.base_ref == 'dev' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      # src/daemon/__e2e__/mobile-workbench.e2e.test.ts(2026-09-22)用 Playwright 驱动
      # 真页面;没有这一步它在 CI 上「Executable doesn't exist」(2026-09-27 PR #121
      # 第一次跑 e2e 就红)。守卫:scripts/ci-workflow.guard.test.ts。
      - name: Install Playwright Chromium
        working-directory: apps/desktop
        run: bun x playwright install --with-deps chromium
      - run: bun --bun vitest run -c vitest.e2e.config.ts

  desktop-e2e:
    # Desktop GUI Playwright suite (apps/desktop) — wizard, dashboard panes,
    # CSP, attachment path-guard. The spec fixture spawns its own DRY_RUN
    # test-shim on :4174, and playwright.config.ts defaults CSP injection on,
    # so this runs headless with no extra wiring beyond a chromium install.
    # Heavy suite — master/PR always, plus any push that actually touched
    # apps/desktop/** (see the `changes` job above).
    needs: changes
    if: github.base_ref == 'master' || github.ref == 'refs/heads/master' || needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - name: Install Playwright Chromium
        working-directory: apps/desktop
        run: bun x playwright install --with-deps chromium
      - name: Desktop e2e (Playwright)
        working-directory: apps/desktop
        run: bun x playwright test
