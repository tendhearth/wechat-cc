name: Desktop Build

# Three-platform Tauri build matrix. Verifies the desktop app compiles on
# Linux / macOS / Windows and uploads each runner's bundle artefacts so we
# can sanity-check installers without spinning up the actual platforms.
#
# Trigger:
#   - manual (Actions tab → Run workflow)
#   - push to a tag matching desktop-v*  (e.g. desktop-v0.1.0)

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'desktop-v*'

jobs:
  build:
    name: build · ${{ matrix.label }}
    # 更新签名私钥只挂在这个环境上,而且带必需审批人(2026-08-31)。
    #
    # 为什么要这道门:公钥烧在每个已安装的 app 里,所以拿着私钥就能让全部
    # 已安装的 wechat-cc 自动下载并运行任意代码 —— 这是远程代码执行的授权
    # 钥匙,不是普通构建凭证。仓库是公开的、不止一个人有写权限,而 Actions
    # 的仓库级 secret 对任何能往分支推工作流的人都是可取的。挂到环境上 +
    # 必需审批,就把"任何人随时可用"降级成"经 owner 点头才可用",而且每次
    # 取用都留痕、都会通知。
    #
    # 代价:每次桌面构建(含 workflow_dispatch 的验证构建)都要点一次批准。
    # 可以接受 —— 这个工作流只在 desktop-v* tag 和手动触发时才跑,不是每次
    # 提交。tauri build 只要发现配置里有公钥就强制签名,所以验证构建同样
    # 需要这把钥匙,没法只给正式发版开门。
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            label: linux-x86_64
            bun_target: bun-linux-x64
            rust_triple: x86_64-unknown-linux-gnu
          # macOS Apple Silicon (M1/M2/M3) — `macos-latest` runners are M-series
          - os: macos-latest
            label: macos-aarch64
            bun_target: bun-darwin-arm64
            rust_triple: aarch64-apple-darwin
          # macOS Intel skipped: macos-13 runners queue indefinitely on the
          # free public-repo tier (33+ min and never picked up at v0.3.0
          # cut time). Intel users have to use the source-mode CLI for
          # now. Revisit when GH's macos-13 capacity recovers, or once
          # cross-compile from macos-latest aarch64 → x64 is viable in
          # `bun build --compile`.
          # Windows x86_64
          - os: windows-latest
            label: windows-x86_64
            bun_target: bun-windows-x64
            rust_triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOTE (2026-08-29): the "Bundle first-party wxvault plugin" step that
      # lived here was removed — tauri.conf's resources were deliberately
      # narrowed to plugins/README.md by 1747de09 (2026-08-26 security fix:
      # the plugins/ glob once swept 105MB of decrypted private WeChat data
      # into a Windows installer via a resolved symlink; published mac dmgs
      # never actually bundled wxvault because macOS bundling doesn't follow
      # symlinks). The daemon loads plugins from the user's install at
      # runtime; the installer doesn't carry plugin sources. The clone step
      # and its "refuse release without wxvault" gate were dead weight after
      # that — restore from git history if bundled distribution ever returns.

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            file \
            build-essential \
            pkg-config \
            libfuse2
          # libfuse2 is required by linuxdeploy / AppImage runtime (it mounts
          # the AppImage as a fuse filesystem during bundling). Newer Ubuntu
          # images dropped fuse2 by default; without this the AppImage step
          # fails with an opaque "failed to run linuxdeploy" message.

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ matrix.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.os }}-

      - name: Cache Tauri target
        uses: actions/cache@v4
        with:
          path: apps/desktop/src-tauri/target
          key: tauri-target-${{ matrix.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/src-tauri/src/**', 'apps/desktop/src-tauri/build.rs') }}
          restore-keys: |
            tauri-target-${{ matrix.os }}-

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install desktop deps
        working-directory: apps/desktop
        run: bun install --frozen-lockfile

      - name: Install root deps (for vitest)
        run: bun install --frozen-lockfile

      - name: Run vitest (touched suites only)
        # Force bash shell — git-for-Windows ships it, and PowerShell doesn't
        # honor the trailing-backslash line continuations we use below, which
        # would silently invoke `vitest run` with no file args and then try to
        # execute `cli.test.ts` as a separate command.
        # apps/desktop/shim.e2e.test.ts is gated to non-Windows: it spawns
        # `bun apps/desktop/test-shim.ts` and the shim's `bun cli.ts` paths
        # fight Git Bash quoting on the Windows runner — verified locally,
        # not worth a Windows-specific shim port for this Tier-1 smoke.
        shell: bash
        # `bun --bun` forces Bun's runtime for the test process so vitest can
        # resolve `bun:sqlite` (used by src/lib/db.ts via doctor.ts since v0.5.1).
        # `bun x vitest` alone spawns workers via Node, which can't import bun:*.
        run: |
          bun --bun vitest run \
            cli.test.ts \
            agent-config.test.ts \
            doctor.test.ts \
            account-remove.test.ts \
            daemon-kill.test.ts \
            memory.test.ts \
            runtime-info.test.ts \
            update.test.ts \
            update.e2e.test.ts \
            src/daemon/onboarding.test.ts \
            apps/desktop/src/view.test.ts \
            $(if [ "$RUNNER_OS" != "Windows" ]; then echo apps/desktop/shim.e2e.test.ts; fi)

      # Compile cli.ts to a self-contained native sidecar that Tauri bundles
      # into the .app/.exe/.deb. This is what makes the desktop install
      # actually self-contained — no system Bun, no cloned wechat-cc source,
      # no PATH lookup. The host OS compiles for its own architecture; cross
      # builds are deliberately not attempted (each runner ships one platform).
      #
      # macOS quirk: bun-compiled binaries are not Mach-O codesign-compatible
      # out of the box (see bun-build's known issue) — we strip the embedded
      # signature, clear quarantine xattrs, and re-sign ad-hoc so the runtime
      # passes Gatekeeper. Tauri's bundle step re-signs everything together
      # later with APPLE_SIGNING_IDENTITY=- (also ad-hoc), which is fine.
      # Sidecar compile — matrix.bun_target picks the bun cross-target,
      # matrix.rust_triple is the suffix Tauri's externalBin loader expects.
      # Linux/macOS use no extension; Windows needs `.exe`. macOS additionally
      # needs xattr/codesign massaging because bun-compiled binaries aren't
      # codesign-compatible out of the box (Tauri's bundle step then re-signs
      # everything ad-hoc with APPLE_SIGNING_IDENTITY=-).
      - name: Compile sidecar (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          bun build --compile --target=${{ matrix.bun_target }} cli.ts \
            --outfile apps/desktop/src-tauri/binaries/wechat-cc-cli-${{ matrix.rust_triple }}
          chmod +x apps/desktop/src-tauri/binaries/wechat-cc-cli-${{ matrix.rust_triple }}
          ls -lh apps/desktop/src-tauri/binaries/

      - name: Compile sidecar (macOS)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          OUT=apps/desktop/src-tauri/binaries/wechat-cc-cli-${{ matrix.rust_triple }}
          bun build --compile --target=${{ matrix.bun_target }} cli.ts --outfile "$OUT"
          xattr -cr "$OUT" || true
          codesign --remove-signature "$OUT" || true
          codesign --force --sign - --identifier=com.tendhearth.wechat-cc.cli "$OUT"
          ls -lh apps/desktop/src-tauri/binaries/

      - name: Compile sidecar (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        # --windows-hide-console is supposed to ship a GUI-subsystem PE
        # so ScheduledTask doesn't pop a console alongside the daemon
        # (users see a CMD they didn't open, can accidentally close it,
        # the wizard's "background service" promise falls apart). Daemon
        # dual-writes logs to <stateDir>/channel.log so losing stderr is
        # fine.
        #
        # **Bun 1.3.x bug**: `--windows-hide-console` is documented in
        # `bun build --help` and accepted silently, but the resulting
        # binary still ships PE subsystem=3 (CONSOLE). Verified locally
        # 2026-05-05 against bun 1.3.13 + on the windows-latest runner.
        # The post-process step below flips the byte by hand.
        # See "Hide console" step.
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          bun build --compile --windows-hide-console --target=${{ matrix.bun_target }} cli.ts \
            --outfile apps/desktop/src-tauri/binaries/wechat-cc-cli-${{ matrix.rust_triple }}.exe
          ls -lh apps/desktop/src-tauri/binaries/

      # PE-subsystem flip — workaround for the Bun bug noted above.
      # IMAGE_DOS_HEADER.e_lfanew (offset 0x3c) → IMAGE_NT_HEADERS at
      # peOff. IMAGE_OPTIONAL_HEADER.Subsystem lives at peOff+0x5c
      # (a UInt16; PE32 and PE32+ both keep it at the same offset since
      # the optional header layout is identical up through the data
      # directories). 3 = IMAGE_SUBSYSTEM_WINDOWS_CUI (console, the bug),
      # 2 = IMAGE_SUBSYSTEM_WINDOWS_GUI (what we want).
      #
      # IDEMPOTENT (2026-08-31): this used to hard-assert 3 before flipping,
      # deliberately, so that a future Bun fix could not silently double-flip.
      # That future arrived — the pinned Bun now honours
      # --windows-hide-console and emits 2 on its own, so the assertion
      # started failing the whole Windows build. Now: 2 ⇒ already correct,
      # log and move on; 3 ⇒ flip and verify; anything else ⇒ still a loud
      # failure, because an unexpected subsystem means our offset math or the
      # binary layout is no longer what we think it is. Safe in both
      # directions, including a Bun regression back to 3.
      - name: Hide console on Windows sidecar (workaround for Bun --windows-hide-console no-op)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $path = 'apps/desktop/src-tauri/binaries/wechat-cc-cli-${{ matrix.rust_triple }}.exe'
          $bytes = [System.IO.File]::ReadAllBytes($path)
          $peOff = [BitConverter]::ToInt32($bytes, 0x3c)
          $before = [BitConverter]::ToUInt16($bytes, $peOff + 0x5c)
          if ($before -eq 2) {
            Write-Output "PE subsystem already 2 (GUI/hidden) — Bun honoured --windows-hide-console, nothing to flip"
            exit 0
          }
          if ($before -ne 3) {
            Write-Error "unexpected PE subsystem=$before (want 3=CONSOLE to flip, or 2=GUI already done) — offset math or binary layout changed, refusing to patch bytes"
            exit 1
          }
          $bytes[$peOff + 0x5c] = 2
          $bytes[$peOff + 0x5d] = 0
          [System.IO.File]::WriteAllBytes($path, $bytes)
          $verify = [System.IO.File]::ReadAllBytes($path)
          $after = [BitConverter]::ToUInt16($verify, $peOff + 0x5c)
          if ($after -ne 2) {
            Write-Error "PE subsystem flip failed: still $after after write"
            exit 1
          }
          Write-Output "PE subsystem flipped: $before -> $after (now GUI/hidden)"

      # Developer ID 签名 + 公证(2026-09-04)—— 有证书才做,没有就照旧 ad-hoc。
      #
      # 为什么必须:macOS 把隐私权限(TCC)记在责任进程的**签名身份**上。ad-hoc
      # 签名每次构建都不一样,于是用户给 wechat-cc 的授权在每次更新后失效;
      # 系统设置里显示的还是一个裸进程名。签了 Developer ID 之后身份稳定,
      # LaunchAgent 起的是 app 主二进制(--daemon),授权只给一次、跟着 app 走,
      # claude / codex / agy 换谁都不碰它。
      #
      # 需要的 secrets(全部挂在 release-signing 环境):
      #   APPLE_CERTIFICATE              .p12 的 base64
      #   APPLE_CERTIFICATE_PASSWORD     .p12 密码
      #   APPLE_SIGNING_IDENTITY         "Developer ID Application: <name> (<TEAMID>)"
      #   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID   公证(APPLE_PASSWORD 是 app 专用密码)
      - name: Import Developer ID certificate (macOS, only when provisioned)
        if: matrix.os == 'macos-latest' && secrets.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "DEVELOPER_ID_READY=1" >> "$GITHUB_ENV"

      - name: Tauri build
        working-directory: apps/desktop
        run: bun run tauri build
        env:
          # 有 Developer ID 就用它(上一步 import 过);否则 "-" = ad-hoc(可运行但
          # 身份不稳,见上面的说明)。Setting this to '' makes Tauri fall through
          # to default signing which fails when no identity is provisioned.
          APPLE_SIGNING_IDENTITY: ${{ env.DEVELOPER_ID_READY == '1' && secrets.APPLE_SIGNING_IDENTITY || '-' }}
          # 公证:三个都在时 Tauri 自动 notarize + staple;缺任何一个就跳过(不报错)。
          APPLE_ID: ${{ env.DEVELOPER_ID_READY == '1' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ env.DEVELOPER_ID_READY == '1' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.DEVELOPER_ID_READY == '1' && secrets.APPLE_TEAM_ID || '' }}
          # tauri-bundler passes `--skip-jenkins` to bundle_dmg.sh whenever
          # CI=true (its guard for tauri-apps/tauri#592, where osascript hangs
          # on headless builders). That flag skips the entire Finder/AppleScript
          # block — which is what actually applies the background image, window
          # size and icon positions from tauri.conf's bundle.macOS.dmg. The
          # result was a bare dmg: app + Applications symlink, no layout at all
          # (verified by mounting the shipped v1.3.7 dmg — no .DS_Store, no
          # .background/). Opting out restores the styled install window.
          # Caveat: bundle_dmg.sh exits 64 when osascript fails, which fails the
          # whole macOS build rather than degrading. Validate dmg changes with a
          # workflow_dispatch run, never straight on a release tag — and if a
          # runner image ever stops giving Finder a usable session, delete this
          # line to fall back to the plain (but always-building) dmg.
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
          # Updater-artifact signing. Since auto-update shipped (v1.6.1,
          # pubkey in tauri.conf), `tauri build` HARD-FAILS after bundling when
          # it finds the pubkey but no private key — that broke every CI build
          # from v1.6.1 through v1.6.4, which is why those installers had to be
          # hand-built on the operator's Mac.
          #
          # The key now lives as an ENVIRONMENT secret on `release-signing`
          # (see the job's `environment:` comment for why it is gated there and
          # not repo-wide). _PASSWORD is intentionally unset: the key pair was
          # generated without one, and an absent secret resolves to '' — which
          # is exactly what the local signed builds pass.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload bundle artefacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wechat-cc-${{ matrix.label }}
          # actions/upload-artifact uses @actions/glob, which does NOT expand
          # `{a,b,c}` brace patterns — earlier `bundle/{dmg,macos}/*` matched
          # zero files. Listing each subdir on its own line is the supported
          # multi-path syntax. Only the subset relevant to each platform exists
          # at runtime; the rest are silently ignored.
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*
            # 必须带 .sig:自动更新的 latest.json 要引用它,而 scripts/
            # publish-update.ts 从产物目录里读。2026-08-31 之前这里写死
            # `*.app.tar.gz`,把签名排除在外 —— nsis/msi 用的是 `*` 所以
            # 一直带着,唯独 macOS 漏了,推更新时只能本地补签。
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz*
            apps/desktop/src-tauri/target/release/bundle/nsis/*
            apps/desktop/src-tauri/target/release/bundle/msi/*
            apps/desktop/src-tauri/target/release/bundle/deb/*
            apps/desktop/src-tauri/target/release/bundle/appimage/*
            apps/desktop/src-tauri/target/release/bundle/rpm/*
          if-no-files-found: warn
          retention-days: 14

  # Aggregate the three platform bundles into a single GitHub Release.
  # Only runs on `desktop-v*` tag pushes (skipped on workflow_dispatch / non-tag
  # runs since those are validation builds without a meaningful version).
  # Creates the release as a *draft* — review notes + flip to published manually.
  release:
    name: Draft GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (for release notes file)
        uses: actions/checkout@v4

      - name: Download all platform bundles
        uses: actions/download-artifact@v4
        with:
          path: bundles
          pattern: wechat-cc-*
          merge-multiple: false

      - name: Flatten bundles for upload
        run: |
          mkdir -p release-files
          # `.sig` 必须在列。上面「Upload bundle artefacts」那一步 2026-08-31
          # 专门修过一次「macOS 的 .sig 被漏掉」,注释就在那儿 —— 但那只保住了
          # CI artifact,**这一步的扩展名白名单又把它过滤掉了**,于是 release
          # 里一个签名都没有,自动更新的 latest.json 无从引用(2026-09-03
          # desktop-v1.6.6 出包时发现)。同一个东西被两层各过滤一次,修了上游
          # 没看下游。
          find bundles -type f \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' -o -name '*.exe' -o -name '*.msi' -o -name '*.nsis.zip' -o -name '*.sig' \) -exec cp -v {} release-files/ \;
          ls -la release-files

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Desktop ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: release-files/*
          fail_on_unmatched_files: false

  e2e-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - working-directory: apps/desktop
        run: |
          bun install
          bunx playwright install chromium --with-deps
          bun run test:e2e:browser
